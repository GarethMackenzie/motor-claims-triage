name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Run lightweight model smoke test
        run: python -m src.train --fast --output-dir results/ci

      - name: Run project QA gate
        run: python qa_project.py --results-dir results/ci
